services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: democracy
      POSTGRES_USER: democracy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U democracy -d democracy']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  init-db:
    build:
      context: .
      target: dependencies
    environment:
      DATABASE_URL: postgresql://democracy:${POSTGRES_PASSWORD}@db:5432/democracy
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    volumes:
      - ./db:/app/db:ro
      - ./scripts:/app/scripts:ro
      - ./.local:/app/.local
    command: ['node', 'scripts/init-db.mjs']
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://democracy:${POSTGRES_PASSWORD}@db:5432/democracy
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
volumes:
  postgres_data:
